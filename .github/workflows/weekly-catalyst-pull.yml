name: Weekly Biotech Catalyst Pull

on:
  schedule:
    # Every Friday at 09:00 EET (07:00 UTC)
    - cron: '0 7 * * 5'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  pull-catalyst-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run biotech catalyst puller
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python biotech_catalyst_puller.py > csv_filename.txt
          CSV_FILE=$(cat csv_filename.txt)
          echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
      
      - name: Commit and push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ${{ env.CSV_FILE }}
          git commit -m "Weekly catalyst pull: ${{ env.CSV_FILE }}"
          git push
        continue-on-error: true
      
      - name: Send notification (optional)
        if: success()
        run: |
          echo "✓ Weekly catalyst pull completed: ${{ env.CSV_FILE }}"
          echo "Download CSV from: https://github.com/${{ github.repository }}/blob/main/${{ env.CSV_FILE }}"
